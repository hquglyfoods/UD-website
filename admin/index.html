<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Content Manager &middot; Ugly Donuts &amp; Corn Dogs</title>

  <!--
    Netlify Identity widget, served from our own site instead of
    identity.netlify.com. A third-party script can be blocked by mobile
    browsers or content blockers, and when that happens the CMS login
    button silently does nothing.
  -->
  <!--
    Runs BEFORE the widget loads. The Identity widget remembers a site URL
    in localStorage and reads it the moment it starts. If that value points
    at another origin (the raw netlify.app address while the CMS runs on the
    custom domain) every login is made against the wrong site, the CMS never
    accepts it, and the widget writes the value straight back. Clearing it
    after the widget has started is too late, so it happens here first.
  -->
  <script>
  (function () {
    try {
      var stored = localStorage.getItem('netlifySiteURL');
      if (!stored) return;
      var same = false;
      try { same = new URL(stored, window.location.href).origin === window.location.origin; } catch (e) {}
      if (!same) {
        localStorage.removeItem('netlifySiteURL');
        localStorage.removeItem('gotrue.user');
      }
    } catch (e) {}
  })();
  </script>

  <script src="/js/netlify-identity-widget.js"></script>

  <style>
    #ud-login {
      position: fixed; inset: 0; z-index: 99999;
      background: #F5EFE6; overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #1A2438;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 48px 20px;
    }
    #ud-login[hidden] { display: none; }
    .ud-card {
      width: 100%; max-width: 380px; background: #fff;
      border: 1.5px solid rgba(26,36,56,0.14); border-radius: 16px;
      padding: 30px 26px 26px;
    }
    .ud-mark { text-align: center; margin-bottom: 22px; }
    .ud-mark img { width: 86px; height: auto; display: inline-block; }
    .ud-card h1 { font-size: 19px; font-weight: 600; margin: 0 0 4px; text-align: center; }
    .ud-card .sub { font-size: 13.5px; color: rgba(26,36,56,0.6); text-align: center; margin: 0 0 22px; }
    .ud-field { margin-bottom: 16px; }
    .ud-field label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 6px; }
    .ud-field input {
      width: 100%; box-sizing: border-box; font: inherit; font-size: 16px;
      padding: 12px 14px; border: 1.5px solid rgba(26,36,56,0.22);
      border-radius: 10px; background: #fff; color: #1A2438;
    }
    .ud-field input:focus { outline: none; border-color: #C1440E; }
    .ud-btn {
      width: 100%; border: none; border-radius: 999px; background: #C1440E;
      color: #fff; font: inherit; font-size: 15.5px; font-weight: 600;
      padding: 13px 20px; cursor: pointer; margin-top: 4px;
    }
    .ud-btn:disabled { opacity: 0.55; cursor: default; }
    .ud-msg { font-size: 13.5px; margin: 14px 0 0; }
    .ud-msg.err { color: #A33; }
    .ud-msg.ok { color: #2c7a4b; }
    .ud-alt {
      margin: 20px 0 0; padding-top: 18px; text-align: center;
      border-top: 1px solid rgba(26,36,56,0.12); font-size: 13px; color: rgba(26,36,56,0.6);
    }
    .ud-alt a { color: #C1440E; text-decoration: none; }
    .ud-alt a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div id="ud-login" hidden>
    <div class="ud-card">
      <div class="ud-mark"><img src="/images/wordmark.png" alt="Ugly Donuts &amp; Corn Dogs"></div>
      <h1>Content Manager</h1>
      <p class="sub">Sign in with your email and password.</p>

      <div class="ud-field">
        <label for="ud-email">Email</label>
        <input type="email" id="ud-email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false">
      </div>
      <div class="ud-field">
        <label for="ud-pass">Password</label>
        <input type="password" id="ud-pass" autocomplete="current-password">
      </div>

      <button type="button" class="ud-btn" id="ud-submit">Sign in</button>
      <p class="ud-msg" id="ud-msg" hidden></p>

      <p class="ud-alt">
        Forgot your password?
        <a href="#" id="ud-reset">Email me a reset link</a>
        <br><br>
        <a href="#" id="ud-popup">Use the standard Netlify login instead</a>
      </p>
    </div>
  </div>

  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>

  <script>
  (function () {
    var panel = document.getElementById('ud-login');
    var msg = document.getElementById('ud-msg');
    var btn = document.getElementById('ud-submit');
    var emailEl = document.getElementById('ud-email');
    var passEl = document.getElementById('ud-pass');
    var IDENTITY = window.location.origin + '/.netlify/identity';
    var settled = false;

    function say(text, kind) {
      msg.textContent = text;
      msg.className = 'ud-msg ' + (kind || '');
      msg.hidden = !text;
    }

    function clearSession() {
      try { localStorage.removeItem('gotrue.user'); } catch (e) {}
    }

    function show() {
      settled = true;
      panel.hidden = false;
      var last = null;
      try { last = localStorage.getItem('ud.lastEmail'); } catch (e) {}
      if (last && !emailEl.value) emailEl.value = last;
      setTimeout(function () { (emailEl.value ? passEl : emailEl).focus(); }, 120);
    }

    function hide() { settled = true; panel.hidden = true; }

    // A stored session is only trustworthy if the server still honours it.
    // Asking Identity directly gives the same answer every time, whether or
    // not the widget has finished starting up. A token that merely looks
    // present can be dead, which is what left the CMS showing a signed-in
    // shell while every save failed with "Requires authentication".
    function verifyStored() {
      var raw = null;
      try { raw = localStorage.getItem('gotrue.user'); } catch (e) {}
      if (!raw) { show(); return; }

      var stored;
      try { stored = JSON.parse(raw); } catch (e) { clearSession(); show(); return; }
      var tok = stored && stored.token;
      if (!tok || !tok.access_token) { clearSession(); show(); return; }

      // Still inside its lifetime: nothing to prove.
      if (tok.expires_at && Date.now() < tok.expires_at - 60000) { hide(); return; }

      if (!tok.refresh_token) { clearSession(); show(); return; }
      fetch(IDENTITY + '/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(tok.refresh_token)
      }).then(function (r) {
        if (!r.ok) throw new Error('refresh rejected');
        return r.json();
      }).then(function (fresh) {
        if (!fresh || !fresh.access_token) throw new Error('no token');
        fresh.expires_at = Date.now() + (Number(fresh.expires_in || 3600) * 1000);
        if (!fresh.refresh_token) fresh.refresh_token = tok.refresh_token;
        stored.token = fresh;
        try { localStorage.setItem('gotrue.user', JSON.stringify(stored)); } catch (e) {}
        hide();
      }).catch(function () {
        clearSession();
        show();
      });
    }

    if (/[?&]relogin\b/.test(window.location.search)) {
      clearSession();
      show();
    } else {
      verifyStored();
    }

    if (window.netlifyIdentity && window.netlifyIdentity.on) {
      window.netlifyIdentity.on('login', hide);
      window.netlifyIdentity.on('logout', show);
    }

    function saveSession(token, user) {
      var entry = {};
      for (var k in user) if (Object.prototype.hasOwnProperty.call(user, k)) entry[k] = user[k];
      entry.url = IDENTITY;
      entry.audience = '';
      token.expires_at = Date.now() + (Number(token.expires_in || 3600) * 1000);
      entry.token = token;
      localStorage.setItem('gotrue.user', JSON.stringify(entry));
    }

    function directLogin(email, password) {
      var body = 'grant_type=password&username=' + encodeURIComponent(email) +
                 '&password=' + encodeURIComponent(password);
      return fetch(IDENTITY + '/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      }).then(function (r) {
        return r.json().then(function (data) {
          if (!r.ok) throw new Error(data.error_description || data.msg || 'Sign in failed');
          return data;
        });
      }).then(function (token) {
        return fetch(IDENTITY + '/user', {
          headers: { Authorization: 'Bearer ' + token.access_token }
        }).then(function (r) { return r.json(); })
          .then(function (user) { saveSession(token, user); });
      });
    }

    function signIn() {
      var email = emailEl.value.trim();
      var password = passEl.value;
      if (!email || !password) { say('Enter your email and password.', 'err'); return; }

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      say('');

      var viaWidget = null;
      try {
        if (window.netlifyIdentity && window.netlifyIdentity.gotrue && window.netlifyIdentity.gotrue.login) {
          viaWidget = window.netlifyIdentity.gotrue.login(email, password, true);
        }
      } catch (e) { viaWidget = null; }

      (viaWidget || directLogin(email, password)).then(function () {
        try { localStorage.setItem('ud.lastEmail', email); } catch (e) {}
        say('Signed in. Loading the content manager...', 'ok');
        window.location.replace(window.location.pathname);
      }).catch(function (err) {
        btn.disabled = false;
        btn.textContent = 'Sign in';
        var text = (err && err.message) || 'Sign in failed';
        if (/invalid|grant|credential/i.test(text)) text = 'That email or password is not right.';
        say(text, 'err');
      });
    }

    btn.addEventListener('click', signIn);
    emailEl.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') passEl.focus(); });
    passEl.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') signIn(); });

    document.getElementById('ud-reset').addEventListener('click', function (ev) {
      ev.preventDefault();
      var email = emailEl.value.trim();
      if (!email) { say('Enter your email above first, then tap the reset link.', 'err'); return; }
      fetch(IDENTITY + '/recover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      }).then(function () {
        say('If that email has an account, a reset link is on its way.', 'ok');
      }).catch(function () {
        say('Could not send the reset email. Try again in a moment.', 'err');
      });
    });

    document.getElementById('ud-popup').addEventListener('click', function (ev) {
      ev.preventDefault();
      if (window.netlifyIdentity && window.netlifyIdentity.open) window.netlifyIdentity.open('login');
      else say('The standard login is unavailable right now. Use the form above.', 'err');
    });

    if (window.CMS && CMS.registerAdditionalLink) {
      CMS.registerAdditionalLink({
        id: 'survey-qr',
        title: 'Survey QR Codes',
        data: '/qr.html',
        options: { iconName: 'page' }
      });
    }
  })();
  </script>
</body>
</html>
