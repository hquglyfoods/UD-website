<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Content Manager &middot; Ugly Donuts &amp; Corn Dogs</title>
</head>
<body>
  <!--
    Decap CMS signs in to GitHub directly (see backend: github in
    config.yml). Netlify Identity and Git Gateway are no longer part of
    the chain, so there is no identity widget to load here and no
    invited-user list to keep in sync: whoever has write access to the
    repository can edit the site.
  -->
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
  <script>
    // Adds the "Survey QR Codes" link to the CMS sidebar.
    if (window.CMS && CMS.registerAdditionalLink) {
      CMS.registerAdditionalLink({
        id: 'survey-qr',
        title: 'Survey QR Codes',
        data: '/qr.html',
        options: { iconName: 'page' }
      });
    }
  </script>
</body>
</html>
