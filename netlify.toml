# Netlify build configuration
# Triggers the index builder on every deploy so the site
# can find newly-added menu items and articles.

[build]
  command = "node build-index.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache markdown content files briefly so updates show within 5 minutes
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Content-hashed images: cache aggressively
[[headers]]
  for = "/images/extracted/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Named images (replaceable): short cache
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Admin: never index, never cache
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Pretty URLs
[[redirects]]
  from = "/order"
  to = "https://uglydonutsandcorndogsknickerbocker.toast.site/order?showAllLocations=true"
  status = 302

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
